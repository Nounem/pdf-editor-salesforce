<template>
    <div class="slds-m-bottom_medium">
        <lightning-card title="Enregistrement Salesforce" icon-name="standard:record">
            <lightning-button lwc:if={activeRecordId} slot="actions" label="Ouvrir l’enregistrement" icon-name="utility:back" onclick={handleViewRecord}></lightning-button>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <p class="slds-m-bottom_small">Facultatif : choisissez un enregistrement pour ouvrir ses PDF et y enregistrer vos modifications. Un PDF de votre ordinateur peut être modifié et téléchargé sans enregistrement.</p>
                <p lwc:if={loadingObjects} role="status">Chargement des objets disponibles…</p>
                <div class="context-controls">
                    <lightning-combobox label="Type d’objet" value={selectedObject} options={objectOptions} onchange={handleObjectChange} disabled={pickerDisabled} placeholder="Choisir un objet"></lightning-combobox>
                    <template for:each={pickerObjects} for:item="object">
                        <lightning-record-picker key={object.value} data-object={object.value} label={pickerLabel} object-api-name={object.value} value={selectedRecordId} onchange={handleRecordChange} onerror={handlePickerError} disabled={pickerDisabled}></lightning-record-picker>
                    </template>
                </div>
                <p lwc:if={message} class="slds-m-top_small slds-text-color_error" role="alert">{message}</p>
            </div>
        </lightning-card>
    </div>
    <c-pdf-editor record-id={activeRecordId} prefetch-engine></c-pdf-editor>
</template>
