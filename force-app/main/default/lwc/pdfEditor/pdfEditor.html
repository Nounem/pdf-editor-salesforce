<template>
    <lightning-card title="Éditeur PDF" icon-name="doctype:pdf">
        <lightning-badge slot="actions" label="Prototype · 1 Mo / 20 pages"></lightning-badge>
        <section class="editor" aria-label="Éditeur PDF">
        <div lwc:if={message} class="notice error" role="alert">{message}</div>
        <lightning-button lwc:if={initializationFailed} label="Réessayer le chargement" onclick={handleRetryEngine} disabled={busy}></lightning-button>
        <lightning-button lwc:if={filesFailed} label="Réessayer la recherche des PDF" onclick={handleRetryFiles} disabled={disabled}></lightning-button>
        <div lwc:if={success} class="notice success" role="status">{success}<lightning-button lwc:if={savedDocumentId} label="Voir le fichier" variant="base" onclick={handleViewSaved}></lightning-button></div>
        <div lwc:if={loadingEngine} class="loading" role="status">Préparation de l’éditeur PDF…</div>
        <div lwc:elseif={busy} class="loading" role="status">Traitement en cours…</div>
        <div lwc:if={notice} class="notice" role="status">{notice}</div>
        <div lwc:if={missingRecord} class="notice" role="status">Ouvrez un PDF depuis votre ordinateur pour le modifier et le télécharger. Pour enregistrer une copie dans Salesforce, choisissez un enregistrement.</div>
        <div lwc:if={contextChanged} class="notice error" role="alert">L’enregistrement a changé. Revenez au précédent pour sauvegarder, ou ouvrez un nouveau document.</div>
        <div class="source-bar" onmouseover={handlePrefetchEngine} onfocusin={handlePrefetchEngine}>
            <template lwc:if={recordId}>
                <div class="source-picker"><lightning-combobox label="PDF de cet enregistrement (50 plus récents)" placeholder="Choisir un fichier Salesforce" value={selectedFile} options={files} onchange={handleFileSelection} disabled={disabled}></lightning-combobox></div>
                <lightning-button label="Ouvrir" onclick={handleOpenSalesforce} disabled={openDisabled}></lightning-button>
            </template>
            <lightning-button label="Depuis mon ordinateur" icon-name="utility:upload" onclick={handleChooseLocalFile} disabled={disabled}></lightning-button>
            <input class="local-file" type="file" accept="application/pdf,.pdf" onchange={handleLocalFile} disabled={disabled} aria-label="Ouvrir un PDF depuis mon ordinateur" hidden />
        </div>
        <template lwc:if={hasDocument}>
            <div class="document-bar">
                <div class="document-name">
                    <lightning-radio-group lwc:if={canSaveVersion} class="save-mode" type="button" label="Enregistrer comme" options={saveModeOptions} value={saveMode} onchange={handleSaveMode} disabled={disabled}></lightning-radio-group>
                    <lightning-input lwc:if={saveAsCopy} label="Nom du nouveau fichier" value={title} maxlength="100" onchange={handleTitle} disabled={disabled}></lightning-input>
                    <p lwc:else class="version-hint">{versionHint}</p>
                </div>
                <div class="save-group"><span class="document-status">{status}</span><lightning-button label="Télécharger le PDF" icon-name="utility:download" onclick={handleDownload} disabled={disabled}></lightning-button><lightning-button label="Enregistrer" icon-name="utility:save" variant="brand" onclick={handleSave} disabled={saveDisabled}></lightning-button></div>
                <a class="download-link" hidden>Copie PDF</a>
            </div>
            <div class="toolbar" role="group" aria-label="Outils d’édition">
                <lightning-button label="Sélection" data-tool="select" variant={selectVariant} onclick={handleTool} disabled={disabled}></lightning-button>
                <lightning-button label="Texte" data-tool="text" variant={textVariant} onclick={handleTool} disabled={disabled}></lightning-button>
                <lightning-button label="Image" icon-name="utility:image" onclick={handleChooseImage} disabled={disabled}></lightning-button>
                <input class="image-file" type="file" accept="image/png,image/jpeg" onchange={handleImage} disabled={disabled} aria-label="Ajouter une image PNG ou JPEG" hidden />
                <lightning-button label="Masquer visuellement" data-tool="mask" variant={maskVariant} onclick={handleTool} disabled={disabled}></lightning-button>
                <span class="toolbar-space"></span>
                <lightning-button-icon icon-name="utility:undo" alternative-text="Annuler" onclick={handleUndo} disabled={undoDisabled}></lightning-button-icon>
                <lightning-button-icon icon-name="utility:redo" alternative-text="Rétablir" onclick={handleRedo} disabled={redoDisabled}></lightning-button-icon>
            </div>
            <div class="workspace">
                <aside class="page-panel" aria-label="Navigation des pages">
                    <h2 class="panel-heading">Document</h2><strong>{pageLabel}</strong>
                    <div class="page-controls"><lightning-button-icon icon-name="utility:chevronleft" alternative-text="Page précédente" onclick={handlePrevious} disabled={previousDisabled}></lightning-button-icon><lightning-button-icon icon-name="utility:chevronright" alternative-text="Page suivante" onclick={handleNext} disabled={nextDisabled}></lightning-button-icon></div>
                    <lightning-combobox label="Zoom" value={zoomValue} options={zoomOptions} onchange={handleZoom} disabled={disabled}></lightning-combobox>
                    <lightning-button label="Tourner de 90°" onclick={handleRotate} disabled={disabled}></lightning-button>
                    <lightning-button label="Retirer la page" variant="destructive-text" onclick={handleDeletePage} disabled={deletePageDisabled}></lightning-button>
                    <p class="muted">L’original n’est jamais perdu : enregistrez une nouvelle version (les précédentes restent consultables) ou un nouveau fichier.</p>
                </aside>
                <div class="canvas-panel">
                    <p class="placement-hint" aria-live="polite">{placementHint}</p>
                    <lightning-button class="center-action" label="Placer l’outil au centre" variant="base" onclick={handleAddCentered} disabled={disabled}></lightning-button>
                    <p lwc:if={rendering} class="render-status" role="status">Préparation de l’aperçu…</p>
                    <div class="canvas-scroll">
                        <div class="page-stage" style={stageStyle} onclick={handleStageClick}>
                            <canvas aria-label="Aperçu du PDF modifié"></canvas>
                            <template for:each={overlays} for:item="element">
                                <button key={element.id} class={element.className} style={element.style} data-element-id={element.id} aria-label={element.label} aria-pressed={element.pressed} title={element.label} onclick={handleSelect} onkeydown={handleElementKey} onpointerdown={handlePointerDown} onpointermove={handlePointerMove} onpointerup={handlePointerUp} onpointercancel={handlePointerCancel} disabled={disabled}>
                                    <span class="content" style={element.contentStyle}>
                                        <span lwc:if={element.isText} class="text-content" style={element.textStyle}>{element.text}</span>
                                        <img lwc:elseif={element.isImage} class="image-content" src={element.imageUrl} alt="" />
                                        <span lwc:else class="mask-content"></span>
                                    </span>
                                    <span lwc:if={element.resizable} class="resize-handle" title="Redimensionner" onpointerdown={handleResizeStart}></span>
                                </button>
                            </template>
                        </div>
                    </div>
                </div>
                <aside class="properties" aria-label="Propriétés de l’ajout sélectionné">
                    <h2 class="panel-heading">Propriétés</h2>
                    <template lwc:if={selected}>
                        <template lwc:if={selectedIsText}>
                            <lightning-input label="Texte (une ligne)" value={selected.text} data-property="text" maxlength="200" oncommit={handleProperty} disabled={disabled}></lightning-input>
                            <lightning-input type="number" label="Taille du texte (pt)" value={selected.fontSize} data-property="fontSize" min="6" max="96" oncommit={handleProperty} disabled={disabled}></lightning-input>
                            <lightning-input type="color" label="Couleur" value={selected.color} data-property="color" onchange={handleProperty} disabled={disabled}></lightning-input>
                        </template>
                        <lightning-input type="number" label="Position X (pt PDF)" value={selected.x} data-property="x" step="0.1" oncommit={handleProperty} disabled={disabled}></lightning-input>
                        <lightning-input type="number" label="Position Y (pt PDF)" value={selected.y} data-property="y" step="0.1" oncommit={handleProperty} disabled={disabled}></lightning-input>
                        <template lwc:if={selectedHasSize}>
                            <lightning-input type="number" label="Largeur (pt)" value={selected.width} data-property="width" min="1" max="2000" step="0.1" oncommit={handleProperty} disabled={disabled}></lightning-input>
                            <lightning-input type="number" label="Hauteur (pt)" value={selected.height} data-property="height" min="1" max="2000" step="0.1" oncommit={handleProperty} disabled={disabled}></lightning-input>
                        </template>
                        <lightning-button label="Supprimer cet ajout" variant="destructive-text" onclick={handleRemove} disabled={disabled}></lightning-button>
                        <p class="muted">Déplacez le cadre ou utilisez les flèches du clavier. Maj + flèche : déplacement plus rapide.</p>
                    </template>
                    <template lwc:else><p class="property-empty">Sélectionnez un ajout sur la page pour le modifier.</p></template>
                    <div class="mask-note"><strong>Masquer n’efface pas.</strong><p>Le texte sous une zone blanche peut rester récupérable. N’utilisez pas cet outil pour retirer des informations confidentielles.</p></div>
                </aside>
            </div>
        </template>
        <template lwc:else>
            <div class="empty-state">
                <lightning-icon icon-name="doctype:pdf" size="large" alternative-text="Document PDF"></lightning-icon>
                <h2>Ouvrir un document PDF</h2>
                <p>Sélectionnez un fichier de cet enregistrement ou importez un PDF depuis votre ordinateur.</p>
                <p>Ajoutez du texte et des images, puis enregistrez le résultat dans Salesforce Files.</p>
                <div class="capabilities"><lightning-badge label="Texte et images"></lightning-badge><lightning-badge label="Rotation des pages"></lightning-badge><lightning-badge label="Original conservé"></lightning-badge></div>
            </div>
        </template>
        </section>
        <p slot="footer" class="session-note">Les ajouts restent modifiables pendant cette session. Leur réédition après fermeture n’est pas encore disponible.</p>
    </lightning-card>
</template>
